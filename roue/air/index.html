    var sel = donnees.slice(0, 16), iv = donnees.slice(16, 28), corps = donnees.slice(28);
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(mdp), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: sel, iterations: ITER, hash: "SHA-256" },
          base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      })
      .then(function (cle) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, cle, corps); })
      .then(function (clair) { return new TextDecoder().decode(clair); });
  }
  function afficher(html, mdp) {
    try { sessionStorage.setItem("apercu-mdp", mdp); } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  }
  var memorise = null;
  try { memorise = sessionStorage.getItem("apercu-mdp"); } catch (e) {}
  if (memorise) {
    dechiffrer(memorise).then(function (html) { afficher(html, memorise); }, function () {
      try { sessionStorage.removeItem("apercu-mdp"); } catch (e) {}
    });
  }
  document.getElementById("porte").addEventListener("submit", function (evenement) {
    evenement.preventDefault();
    var mdp = document.getElementById("mdp").value;
    dechiffrer(mdp).then(function (html) { afficher(html, mdp); }, function () {
      document.getElementById("erreur").textContent = "Mot de passe incorrect.";
    });
  });
})();
</script>

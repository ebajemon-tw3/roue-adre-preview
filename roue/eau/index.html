  try { memorise = sessionStorage.getItem("apercu-mdp"); } catch (e) {}
  if (memorise) {
    dechiffrer(memorise).then(function (html) { afficher(html, memorise); }, function () {
      try { sessionStorage.removeItem("apercu-mdp"); } catch (e) {}
    });
  }
  document.getElementById("porte").addEventListener("submit", function (evenement) {
    evenement.preventDefault();
    var mdp = document.getElementById("mdp").value;
    dechiffrer(mdp).then(function (html) { afficher(html, mdp); }, function () {
      document.getElementById("erreur").textContent = "Mot de passe incorrect.";
    });
  });
})();
</script>
</body>
</html>
